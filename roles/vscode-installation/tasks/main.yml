---
- name: "Check the presence of /etc/apt/sources.list.d/vscode.sources"
  stat:
    path: "/etc/apt/sources.list.d/vscode.sources"
  register: vscode_list
  changed_when: false

- name: "Removing Apt Source List Conflict"
  file:
    path: "/etc/apt/sources.list.d/vscode.sources"
    state: absent
  become: true
  become_method: sudo
  when: vscode_list.stat.exists

- name: "Downloading Microsoft GPG key"
  get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /tmp/microsoft.asc
    mode: "0644"
  become: true
  when: ansible_facts['distribution']|lower in ['parrot', 'debian', 'ubuntu']
  changed_when: false

- name: "Installing Microsoft GPG key"
  shell: gpg --dearmor < /tmp/microsoft.asc > /usr/share/keyrings/microsoft.gpg
  args:
    creates: /usr/share/keyrings/microsoft.gpg
  become: true
  when: ansible_facts['distribution']|lower in ['parrot', 'debian', 'ubuntu']

