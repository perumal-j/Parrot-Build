- name: "Adding VScode apt repository"
  deb822_repository:
    name: vscode
    types: deb
    uris: "https://packages.microsoft.com/repos/code"
    suites: stable
    components: main
    architectures: "amd64,arm64,armhf"
    signed_by: "https://packages.microsoft.com/keys/microsoft.asc"
    state: present
  become: true
  become_method: sudo
  when: ansible_facts['distribution']|lower in ['parrot', 'debian', 'ubuntu']
  
- name: "Installing Visual Studio Code"
  apt:
    name: code
    state: present
    update_cache: true
  become: true
  when: ansible_facts['distribution']|lower in ['parrot', 'debian', 'ubuntu']

- name: "Installing Visual Studio Code Extensions"
  command: "code --install-extension {{ item }} --force"
  loop:
    - Codeium.codeium
    - snyk-security.snyk-vulnerability-scanner
    - ms-python.python
    - DEVSENSE.phptools-vscode
    - ms-vscode.cpptools
    - golang.Go
    - rust-lang.rust-analyzer
    - ms-vscode.cpptools-extension-pack
  become: true
  become_user: "{{ ansible_facts['user_id'] }}"
  register: ext_install
  changed_when: "'is already installed' not in ext_install.stdout"
  ignore_errors: true
