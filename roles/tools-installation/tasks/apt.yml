---
- name: "Updating Apt Cache"
  command: apt-get update
  become: true
  become_method: sudo
  changed_when: false

- name: "Upgrade All Packages"
  apt: upgrade=yes force_apt_get=yes
  become: true
  become_method: sudo

- name: "Updating Apt Cache"
  command: apt-get update
  become: true
  become_method: sudo
  changed_when: false

  
- name: "Installing Tools via Apt - Ubuntu Aarch64"
  package:
    name:
      - jq
      - rlwrap
      - flameshot
      - exiftool
      - ca-certificates
      - curl
      - hydra
      - cupp
      - medusa
      # - ntpdate
      - gh
      - pipx
      - sublime-text
      - xclip
      - remmina
      - nautilus
      - sqlite3
      - python3-dev
      - build-essential
      - libssl-dev 
      - libffi-dev
      - ldap-utils
      # - python3.12-dev
      - nmap
      - gobuster
      - krb5-user
      - unrar
      - python3-pyftpdlib
      - 7zip
      - fierce
      - dnsrecon
      - sublist3r
      - wireshark
      - libkrb5-dev
      - pkg-config
      - libreadline-dev
      - libncurses-dev
      - libfuse2
      - onesixtyone
      - crunch
      - braa
      - evolution
      - cifs-utils
      - fonts-jetbrains-mono
      - smbmap
      - lftp
      - ncftp
      - claws-mail
      - geary
      - mailutils
      - sendemail
      - rdesktop
    state: latest
  become: true
  become_method: sudo
  when: ansible_facts['distribution']|lower == 'ubuntu' and ansible_facts['architecture']|lower == 'aarch64'

