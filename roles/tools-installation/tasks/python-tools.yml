- name: "Check if volatility3 tool is already installed"
  shell: "uv tool list"
  register: volatility3
  changed_when: false

- name: "Ensure temporary bin directory exists"
  file:
    path: "{{ temp_bin_dir }}"
    state: directory
    mode: '0755'

- name: "Install volatility3 with yara-python and pycryptodome"
  shell:
    cmd: "uv tool install volatility3 --with yara-python --with pycryptodome"
  environment:
    UV_TOOL_BIN_DIR: "{{ temp_bin_dir }}"
  when: "'vol' not in volatility3.stdout"

- name: "Find all generated executables in temporary directory"
  find:
    paths: "{{ temp_bin_dir }}"
    file_type: any
  register: found_files

- name: "Move executables to /usr/local/bin with root privileges"
  copy:
    src: "{{ item.path }}"
    dest: "{{ target_bin_dir }}/{{ item.path | basename }}"
    remote_src: true
