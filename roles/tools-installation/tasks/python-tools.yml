- name: "Check presence of PKINITtools"
  stat:
    path: "/opt/PKINITtools"
  register: PKINITtools
  changed_when: false

- name: "Downloading PKINITtools from Github"
  git:
    repo: https://github.com/dirkjanm/PKINITtools.git
    dest: "/opt/PKINITtools"
    version: master
  become: true
  become_method: sudo
  when: not PKINITtools.stat.exists

- name: "Modifying PKINITtools Directory Owner"
  file:
    path: "/opt/PKINITtools"
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
    mode: 0755
    state: directory
    recurse: true
  become: true
  become_method: sudo
  changed_when: false

- name: "Check the presence of gettgtpkinit"
  stat:
    path: "/usr/local/bin/gettgtpkinit"
  register: gettgtpkinit
  changed_when: false

- name: "Check the presence of gets4uticket"
  stat:
    path: "/usr/local/bin/gets4uticket"
  register: gets4uticket
  changed_when: false

- name: "Check the presence of getnthash"
  stat:
    path: "/usr/local/bin/getnthash"
  register: getnthash
  changed_when: false

- name: "Adding Dependencies to PKINITtools"
  shell: |
    cd /opt/PKINITtools
    {{ ansible_facts['env']['HOME'] }}/.local/bin/uv add --script /opt/PKINITtools/{{ item }}.py -r /opt/PKINITtools/requirements.txt
  loop:
    - gettgtpkinit
    - gets4uticket
    - getnthash
  become: true
  become_method: sudo
  when: not gettgtpkinit.stat.exists or not gets4uticket.stat.exists or not getnthash.stat.exists

- name: "Tweaking Shebang"
  replace:
    path: "/opt/PKINITtools/{{ item }}.py"
    regexp: "#!/usr/bin/env python3"
    replace: "#!/usr/bin/env -S uv run --script"
  loop:
    - gettgtpkinit
    - gets4uticket
    - getnthash
  become: true
  become_method: sudo
  when: not gettgtpkinit.stat.exists or not gets4uticket.stat.exists or not getnthash.stat.exists

- name: "Adding PKINITtools .py files to /usr/local/bin"
  copy:
    src: "/opt/PKINITtools/{{ item }}.py"
    dest: "/usr/local/bin/{{ item }}"
    mode: 0755
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
  loop:
    - gettgtpkinit
    - gets4uticket
    - getnthash
  become: true
  become_method: sudo
  when: not gettgtpkinit.stat.exists or not gets4uticket.stat.exists or not getnthash.stat.exists

- name: "Upgrading UV tools"
  shell: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv tool upgrade --all"
  when: ansible_facts['distribution'] == "Ubuntu" or ansible_facts['distribution'] == "Parrot" or ansible_facts['distribution'] == "Debian"
  become: true
  become_method: sudo
  changed_when: false

