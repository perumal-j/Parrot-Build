---
- name: "Check if Python UV exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"
  register: uv_manager_exists
  changed_when: false

- name: "Copying uv-install.sh"
  copy:
    src: "uv-install.sh"
    dest: "/tmp/uv-install.sh"
    mode: 0755

- name: "Installing Python UV"
  shell: /tmp/uv-install.sh
  when: not uv_manager_exists.stat.exists

- name: "Check if uv is linked system-wide"
  stat:
    path: "/usr/local/bin/uv"
  register: "uv_linked"
  changed_when: false

- name: "Symlink uv and uvx to /usr/local/bin"
  file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    mode: 0755
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
  become: true
  become_method: sudo
  loop:
    - uv
    - uvx
  when: not uv_linked.stat.exists

- name: "uv self-update"
  shell: "uv self update"
  changed_when: false

- name: Debug HOME on the control machine
  debug:
    msg: "{{ lookup('env', 'HOME') }}"

- name: "Check if Certipy exists"
  stat:
    path: "/usr/local/bin/certipy"
  register: certipy_exists
  changed_when: false

- name: "Check if pywhisker exists"
  stat:
    path: "/usr/local/bin/pywhisker"
  register: pywhisker_exists
  changed_when: false

- name: "Check if bloodyAD exists"
  stat: 
    path: "/usr/local/bin/bloodyAD"
  register: bloodyAD_exists
  changed_when: false

- name: "Check if pwntools repository exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/uv/tools/pwntools/bin"
  register: pwntools_exists
  changed_when: false

- name: "Check if ldeep exists"
  stat: 
    path: "/usr/local/bin/ldeep"
  register: ldeep_exists
  changed_when: false

- name: "Ensure temporary bin directory exists"
  file:
    path: "{{ temp_bin_dir }}"
    state: directory
    mode: '0755'

- name: "Installing Certipy, pywhisker, bloodyAD, pwntools & ldeep"
  shell:
    cmd: uv tool install {{ item.url }}
  environment:
    UV_TOOL_BIN_DIR: "{{ temp_bin_dir }}"
  loop: "{{ UVtoolsGit }}"
  when: not certipy_exists.stat.exists or not pywhisker_exists.stat.exists or not bloodyAD_exists.stat.exists or not pwntools_exists.stat.exists or not ldeep_exists.stat.exists

- name: "Find all generated executables in temporary directory"
  find:
    paths: "{{ temp_bin_dir }}"
    file_type: any
  register: found_files

- name: "Move executables to /usr/local/bin with root privileges"
  copy:
    src: "{{ item.path }}"
    dest: "{{ target_bin_dir }}/{{ item.path | basename }}"
    remote_src: true
    mode: 0755
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
  loop: "{{ found_files.files }}"
  become: true
  become_method: sudo

- name: "Removing Netexec"
  apt:
    name: netexec
    state: absent
    purge: yes
  become: true
  become_method: sudo 

- name: "Removing WafWoof"
  apt:
    name: wafw00f
    state: absent
    purge: yes
  become: true
  become_method: sudo 
  
- name: "Check if NetExec exists"
  stat:
    path: "/usr/local/bin/netexec"
  register: netexec
  changed_when: false

- name: "Check if wafw00f exists"
  stat:
    path: "/usr/local/bin/wafw00f"
  register: wafw00f
  changed_when: false

- name: "Check if DonPAPI exists"
  stat:
    path: "/usr/local/bin/donpapi"
  register: donpapi
  changed_when: false

- name: "Ensure temporary bin directory exists"
  file:
    path: "{{ temp_bin_dir }}"
    state: directory
    mode: '0755'

- name: "Installing NetExec, wafw00f, & DonPAPI via pipx"
  shell:
    cmd: pipx install {{ item.url }}
  environment:
    PIPX_BIN_DIR: "{{ temp_bin_dir }}"
  loop: "{{ PIPToolsGit }}"
  when: not netexec.stat.exists or not wafw00f.stat.exists or not donpapi.stat.exists

