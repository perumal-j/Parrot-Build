- name: "Uninstall old Impacket"
  apt:
    name: python3-impacket
    state: absent
    purge: yes
  become: true
  become_method: sudo

- name: "Check if Impacket Exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/uv/tools/impacket/bin"
  register: "impacket_exists"
  changed_when: false

- name: "Check if sshuttle Exists"
  stat:
    path: "/usr/local/bin/sshuttle"
  register: "sshuttle_exists"
  changed_when: false

- name: "Check if updog exists"
  stat:
    path: "/usr/local/bin/updog"
