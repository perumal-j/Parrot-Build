    group: "{{ ansible_facts['env']['USER'] }}"
  loop: "{{ found_files.files }}"
  become: true
  become_method: sudo

- name: "Clean up temporary bin directory"
  file:
    path: "{{ temp_bin_dir }}"
    state: absent

- name: "Upgrading all UV tools"
  shell:
    cmd: "uv tool upgrade --all"
  changed_when: false

- name: "Check the presence of tools in repositories"
  stat:
    path: /usr/local/bin/{{ item.name }}
  loop: "{{ repositories }}"
  register: repositories_tool

- name: "Copying Github Download Template"
  template:
    src: "uv-manager.j2"
    dest: "/tmp/uv-manager.sh"
    mode: 0755

- name: "Executing Bash Script to Install Python UV"
  shell: "/tmp/uv-manager.sh"
  when: repositories_tool.results | selectattr('stat.exists') | list | length == 0

