  register: printerbug
  changed_when: false

- name: "Copying printerbug.sh to .local/bin"
  copy:
    src: "printerbug.sh"
    dest: "/usr/local/bin/printerbug"
    mode: 0755
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
  become: true
  become_method: sudo
  when: not printerbug.stat.exists

- name: "Check the presence of passthecert"
  stat:
    path: "/usr/local/bin/passthecert"
  register: passthecert
  changed_when: false

- name: "Copying passthecert.sh to /usr/local/bin"
  copy:
    src: "passthecert.sh"
    dest: "/usr/local/bin/passthecert"
    mode: 0755
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
  become: true
  become_method: sudo
  when: not passthecert.stat.exists

