---
- name: "Check if Python UV exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"
  register: uv_manager_exists
  changed_when: false

- name: "Copying uv-install.sh"
  copy:
    src: "uv-install.sh"
    dest: "/tmp/uv-install.sh"
    mode: 0755

- name: "Installing Python UV"
  shell: /tmp/uv-install.sh
  when: not uv_manager_exists.stat.exists

- name: "Removing Netexec"
  apt:
    name: netexec
    state: absent
    purge: yes
  become: true
  become_method: sudo 

- name: "Removing WafWoof"
  apt:
    name: wafw00f
    state: absent
    purge: yes
  become: true
  become_method: sudo 
  
- name: "Check if NetExec exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/netexec"
  register: netexec
  changed_when: false

- name: "Check if wafw00f exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/wafw00f"
  register: wafw00f
  changed_when: false

- name: Debug HOME on the control machine
  debug:
    msg: "{{ lookup('env', 'HOME') }}"

- name: "Check if Certipy exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/certipy"
  register: certipy_exists
  changed_when: false

- name: "Check if pywhisker exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/pywhisker"
  register: pywhisker_exists
  changed_when: false

- name: "Check if bloodyAD exists"
  stat: 
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/bloodyAD"
  register: bloodyAD_exists
  changed_when: false

- name: "Check if pwntools repository exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/uv/tools/pwntools"
  register: pwntools_exists
  changed_when: false

- name: "Check if gettgtpkinit exists"
  stat: 
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/gettgtpkinit"
  register: gettgtpkinit_exists
  changed_when: false

- name: "Check if ldeep exists"
  stat: 
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/ldeep"
  register: ldeep_exists
  changed_when: false

- name: "Installing Certipy, pywhisker, bloodyAD, pwntools, gettgtpkinit, ldeep_exists"
  shell:
    cmd: uv tool install {{ item.url }}
  loop: "{{ UVtoolsGit }}"
  when: not certipy_exists.stat.exists and not pywhisker_exists.stat.exists and not bloodyAD_exists.stat.exists and not pwntools_exists.stat.exists and not gettgtpkinit_exists.stat.exists and not ldeep_exists.stat.exists

- name: "Installing NetExec & wafw00f via pipx"
  shell:
    cmd: pipx install {{ item.url }}
  loop: "{{ PIPToolsGit }}"
  when: not netexec.stat.exists or not wafw00f.stat.exists

- name: "Uninstall old Impacket"
  apt:
    name: python3-impacket
    state: absent
    purge: yes
  become: true
  become_method: sudo

- name: "Check if Impacket Exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/uv/tools/impacket/bin"
  register: "impacket_exists"
  changed_when: false

- name: "Check if sshuttle Exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/sshuttle"
  register: "sshuttle_exists"
  changed_when: false

- name: "Check if updog exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/updog"
  register: "updog_exists"
  changed_when: false

- name: "Check if scrapy exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/scrapy"
  register: "scrapy_exists"
  changed_when: false

- name: "Installing Impacket, sshuttle, Updog, Scrapy via UV"
  shell:
    cmd: "uv tool install {{ item }}"
  loop: "{{ UVtools }}"
  when: not sshuttle_exists.stat.exists or not impacket_exists.stat.exists or not updog_exists.stat.exists or not scrapy_exists.stat.exists
   
- name: "Check if volatility3 tool is already installed"
  shell: "uv tool list"
  register: uv_tool_list
  changed_when: false

- name: "Install volatility3 with yara-python and pycryptodome"
  command: "uv tool install volatility3 --with yara-python --with pycryptodome"
  when: "'volatility3' not in uv_tool_list.stdout"

- name: "Copying Github Download Template"
  template:
    src: "uv-manager.j2"
    dest: "/tmp/uv-manager.sh"
    mode: 0755

- name: "Executing Bash Script to Install Python UV"
  shell: "/tmp/uv-manager.sh"
  changed_when: false

- name: "Check if targetedKerberoast exists"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/targetedKerberoast"
  register: targetedKerberoast
  changed_when: false

- name: "Copying targetedKerberoast to .local/bin"
  copy:
    src: "/tmp/targetedKerberoast/targetedKerberoast.py"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/targetedKerberoast"
    mode: 0755
  when: not targetedKerberoast.stat.exists

- name: "Check presence of PKINITtools"
  stat:
    path: "/opt/PKINITtools"
  register: PKINITtools
  changed_when: false

- name: "Downloading PKINITtools from Github"
  git:
    repo: https://github.com/dirkjanm/PKINITtools.git
    dest: "/opt/PKINITtools"
    version: master
  become: true
  become_method: sudo
  when: not PKINITtools.stat.exists

- name: "Modifying PKINITtools Directory Owner"
  file:
    path: "/opt/PKINITtools"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    state: directory
    recurse: true
  become: true
  become_method: sudo
  changed_when: false

- name: "Check the presence of gettgtpkinit.py"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/gettgtpkinit"
  register: gettgtpkinit
  changed_when: false

- name: "Adding Dependencies to PKINITtools"
  shell: |
    cd /opt/PKINITtools
    /home/perumalj/.local/bin/uv add --script /opt/PKINITtools/gettgtpkinit.py -r /opt/PKINITtools/requirements.txt
  become: true
  become_method: sudo
  when: not gettgtpkinit.stat.exists

- name: "Tweaking Shebang"
  replace:
    path: "/opt/PKINITtools/gettgtpkinit.py"
    regexp: "#!/usr/bin/env python3"
    replace: "#!/usr/bin/env -S uv run --script"
  become: true
  become_method: sudo

- name: "Adding gettgtpkinit.py to .local/bin"
  copy:
    src: "/opt/PKINITtools/gettgtpkinit.py"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/gettgtpkinit"
    mode: 0755
  become: true
  become_method: sudo
  when: not gettgtpkinit.stat.exists

- name: "Upgrading UV tools"
  shell: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv tool upgrade --all"
  when: ansible_facts['distribution'] == "Ubuntu" or ansible_facts['distribution'] == "Parrot" or ansible_facts['distribution'] == "Debian"
  become: true
  become_method: sudo
  changed_when: false
  # ignore_errors: true

- name: :"Check the presence of SMB_Killer"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/SMB_Killer.py"
  register: smb_killer
  changed_when: false


- name: "Git Cloning SMB_Killer"
  git:
    repo: "https://github.com/overgrowncarrot1/SMB_Killer.git"
    dest: "/opt/SMB_Killer"
  become: true
  become_method: sudo 
  when: not smb_killer.stat.exists

- name: "Modifying SMB_Killer Directory Owner"
  file:
    path: "/opt/SMB_Killer"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    state: directory
    recurse: true
  become: true
  become_method: sudo
  changed_when: false

- name: "Adding SMB_Killer to .local/bin"
  copy:
    src: "/opt/SMB_Killer/SMB_Killer.py"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/SMB_Killer.py"
    mode: 0755
  when: not smb_killer.stat.exists

- name: "Check the presence of /opt/ReconSpider.v1.2.zip"
  stat:
    path: "/opt/ReconSpider.v1.2.zip"
  register: ReconSpider
  changed_when: false

- name: "Check the presence of /opt/ReconSpider.py"
  stat:
    path: "/opt/ReconSpider.py"
  register: ReconSpiderPy
  changed_when: false

- name: "Downloading https://academy.hackthebox.com/storage/modules/144/ReconSpider.v1.2.zip"
  get_url:
    url: "https://academy.hackthebox.com/storage/modules/144/ReconSpider.v1.2.zip"
    dest: "/opt/ReconSpider.v1.2.zip"
    mode: 0755
  become: true
  become_method: sudo
  when: not ReconSpider.stat.exists

- name: "Unzipping ReconSpider"
  unarchive:
    src: "/opt/ReconSpider.v1.2.zip"
    dest: "/opt"
  become: true
  become_method: sudo
  when: not ReconSpiderPy.stat.exists

- name: "Check the presence of ReconSpider in PATH"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/reconspider"
  register: ReconSpiderBIN
  changed_when: false

- name: "Moving reconspider.sh to .local/bin"
  copy:
    src: "reconspider.sh"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/reconspider"
    mode: 0755
  when: not ReconSpiderBIN.stat.exists

- name: "Check if theHarvester is already cloned"
  stat:
    path: "/opt/theHarvester"
  register: theHarvester_precheck

- name: "git clone https://github.com/laramies/theHarvester.git"
  git:
    repo: "https://github.com/laramies/theHarvester.git"
    dest: "/opt/theHarvester"
  become: true
  become_method: sudo
  when: not theHarvester_precheck.stat.exists

- name: "Check the presence of /opt/theHarvester"
  stat:
    path: "/opt/theHarvester"
  register: theHarvester
  changed_when: false

- name: "Change the owner of /opt/theHarvester"
  file:
    path: "/opt/theHarvester"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    state: directory
    recurse: true
  become: true
  become_method: sudo
  when: theHarvester.stat.exists

- name: "Installing theHarvester"
  shell: "uv sync"
  args:
    chdir: "/opt/theHarvester"
  when: theHarvester.stat.exists

- name: "Check if FinalRecon is already cloned"
  stat:
    path: "/opt/FinalRecon"
  register: FinalRecon_precheck

- name: "git clone https://github.com/thewhiteh4t/FinalRecon.git"
  git:
    repo: "https://github.com/thewhiteh4t/FinalRecon.git"
    dest: "/opt/FinalRecon"
  become: true
  become_method: sudo
  when: not FinalRecon_precheck.stat.exists

- name: "Check the presence of /opt/FinalRecon"
  stat:
    path: "/opt/FinalRecon"
  register: FinalRecon
  changed_when: false

- name: "Change the owner of /opt/FinalRecon"
  file:
    path: "/opt/FinalRecon"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    state: directory
    recurse: true
  become: true
  become_method: sudo
  when: FinalRecon.stat.exists

- name: "Check the presence of /opt/FinalRecon/.venv/bin/python"
  stat:
    path: "/opt/FinalRecon/.venv/bin/python"
  register: FinalRecon_venv
  changed_when: false

- name: "uv venv for FinalRecon"
  shell: "uv venv"
  args:
    chdir: "/opt/FinalRecon"
  when: not FinalRecon_venv.stat.exists

- name: "uv pip install -r requirements.txt"
  shell: "uv pip install -r requirements.txt"
  args:
    chdir: "/opt/FinalRecon"
  when: not FinalRecon_venv.stat.exists

- name: "chmod +x ./finalrecon.py"
  shell: "chmod +x ./finalrecon.py"
  args:
    chdir: "/opt/FinalRecon"
  when: FinalRecon.stat.exists

- name: "Check the presence of finalrecon"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/finalrecon"
  register: finalrecon

- name: "Adding FinalRecon to .local/bin"
  copy:
    src: "finalRecon.sh"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/finalrecon"
    mode: 0755
  when: not finalrecon.stat.exists

- name: "Check the presence of theHarvester"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/theharvester"
  register: theharvester

- name: "Adding theHarvester.sh to .local/bin"
  copy:
    src: "theHarvester.sh"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/theharvester"
    mode: 0755
  when: not theharvester.stat.exists
