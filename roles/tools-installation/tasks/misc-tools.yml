---
- name: "Check the presence of footprinting-wordlist.txt"
  stat:
    path: "/usr/share/wordlists2/footprinting-wordlist.txt"
  register: footprinting_wordlist
  changed_when: false

- name: "Check the presence of fasttrack.txt"
  stat:
    path: "/usr/share/wordlists2/fasttrack.txt"
  register: fasttrack_wordlist
  changed_when: false

- name: "Installing drtychai/wordlists from GitHub"
  shell:
    cmd: "git clone -j`nproc` https://github.com/drtychai/wordlists /tmp/wordlists-drtychai/"
  when: not fasttrack_wordlist.stat.exists

- name: "Installing boboaung1337/wordlists from GitHub"
  git:
    repo: "{{ item }}"
    dest: "/tmp/wordlists-boboaung1337/"
  loop:
    - https://github.com/boboaung1337/wordlists
  when: not footprinting_wordlist.stat.exists 

- name: "Copy drtychai wordlists into /usr/share/wordlists"
  synchronize:
    src: "/tmp/wordlists-drtychai/"
    dest: "/usr/share/wordlists2"
    rsync_opts:
      - "--exclude=.git"
  become: true
  become_method: sudo
  when: not fasttrack_wordlist.stat.exists

- name: "Copy boboaung1337 wordlists into /usr/share/wordlists"
  synchronize:
    src: "/tmp/wordlists-boboaung1337/"
    dest: "/usr/share/wordlists2"
    rsync_opts:
      - "--exclude=.git"
  become: true
  become_method: sudo
  when: not footprinting_wordlist.stat.exists

- name: "Change owner of boboaung1337/wordlists & drtychai/wordlists"
  file:
    path: "/usr/share/wordlists"
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
    recurse: yes
  become: true
  become_method: sudo

- name: "Downloading smtp-user-enum"
  get_url:
    url: "https://pentestmonkey.net/tools/smtp-user-enum/smtp-user-enum-1.2.tar.gz"
    dest: "/tmp/smtp-user-enum-1.2.tar.gz"

- name: "Check the existence of /tmp/smtp-user-enum-1.2.tar.gz"
  stat: 
    path: "/tmp/smtp-user-enum-1.2.tar.gz"
  register: smtp_user_enum
  changed_when: false

- name: "Extracting smtp-user-enum-1.2.tar.gz"
  unarchive:
    src: "/tmp/smtp-user-enum-1.2.tar.gz"
    dest: "/opt"
  become: true
  become_method: sudo
  when: smtp_user_enum.stat.exists

- name: "Check the presence of Sqlcmd"
  stat:
    path: "/tmp/sqlcmd-latest.json"
  register: sqlcmd_metadata
  changed_when: false

- name: "Downloading Metadata of Sqlcmd" 
  get_url:
    url: "https://api.github.com/repos/microsoft/go-sqlcmd/releases/latest"
    dest: "/tmp/sqlcmd-latest.json"
    mode: '0640'
    headers:
      Authorization: "token {{ github_api_key }}"
  when: not sqlcmd_metadata.stat.exists

- name: "Check the presence of sqlcmd-latest.json post Downloading"
  stat:
    path: "/tmp/sqlcmd-latest.json"
  register: sqlcmd_metadata_post_download
  changed_when: false

- name: "Read sqlcmd-latest.json from disk"
  slurp:
    src: "/tmp/sqlcmd-latest.json"
  register: sqlcmd_release_file
  when: sqlcmd_metadata_post_download.stat.exists

- name: "Parse Sqlcmd Release JSON /tmp/sqlcmd-latest.json"
  set_fact:
    sqlcmd_release_json: "{{ sqlcmd_release_file.content | b64decode | from_json }}"
  changed_when: false

- name: "Extract latest stable release of Sqlcmd"
  set_fact:
    sqlcmd_latest_version: "{{ sqlcmd_release_json.tag_name }}"

- name: "Print Sqlcmd Version"
  debug:
    var: sqlcmd_latest_version

- name: "Check the existence of Sqlcmd"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/sqlcmd"
  register: sqlcmd_exists
  changed_when: false

- name: "Create an empty sqlcmd_current_version.txt"
  file:
    path: "/opt/current_versions/sqlcmd_current_version.txt"
    state: touch
    mode: 0644
  become: true
  become_method: sudo
  when: not sqlcmd_exists.stat.exists

- name: "Check the presence of /opt/current_versions/sqlcmd_current_version.txt"
  stat:
    path: "/opt/current_versions/sqlcmd_current_version.txt"
  register: sqlcmd_version_file
  changed_when: false

- name: "Read Current Version from file /opt/current_versions/sqlcmd_current_version.txt"
  set_fact:
    sqlcmd_current_version: "{{ lookup('file', '/opt/current_versions/sqlcmd_current_version.txt') }}"
  when: sqlcmd_version_file.stat.exists

- name: "Compare sqlcmd_current_version with sqlcmd_latest_version"
  set_fact:
    sqlcmd_update_required: "{{ sqlcmd_current_version != sqlcmd_latest_version }}"
  when: sqlcmd_version_file.stat.exists

- name: "Downloading Sqlcmd"
  get_url:
    url: "https://github.com/microsoft/go-sqlcmd/releases/download/{{ sqlcmd_latest_version }}/sqlcmd-linux-amd64.tar.bz2"
    dest: "/tmp/sqlcmd-linux-amd64.tar.bz2"
    mode: '0640'
    headers:
      Authorization: "token {{ github_api_key }}"
  when: sqlcmd_update_required

- name: "Store latest version in the current version file"
  copy:
    dest: "/opt/current_versions/sqlcmd_current_version.txt"
    content: "{{ sqlcmd_latest_version }}"
    mode: "0644"
  become: true
  become_method: sudo
  when: sqlcmd_update_required

- name: "Extracting Sqlcmd"
  unarchive:
    src: "/tmp/sqlcmd-linux-amd64.tar.bz2"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
  when: sqlcmd_update_required

- name: "Check the existence of wsgidav"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/wsgidav"
  register: wsgidav_exists
  changed_when: false

- name: "Refreshing bashrc"
  shell: ". {{ ansible_facts['env']['HOME'] }}/.bashrc"
  changed_when: false

- name: "Check that the wsgidav environment is healthy"
  command: 
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/share/uv/tools/wsgidav/bin/python"
      - -c
      - import wsgidav, cheroot, lxml
  register: wsgidav_env_check
  ignore_errors: true
  when: wsgidav_exists.stat.exists

- name: "Install wsgidav with cheroot and lxml"
  command: "uv tool install wsgidav --with cheroot --with lxml"
  when: not wsgidav_env_check.rc == 0 and wsgidav_exists.stat.exists

- name: "check the presence of $HOME/.local/bin/keytabextract"
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/keytabextract"
  register: keytabextract
  changed_when: false

- name: "Cloning https://github.com/sosdave/KeyTabExtract"
  git:
    repo: "https://github.com/sosdave/KeyTabExtract.git"
    dest: "/tmp/KeyTabExtract"
    version: "master"
  when: not keytabextract.stat.exists

- name: "Placing keytabextract.py in $HOME/.local/bin"
  copy:
    src: "/tmp/KeyTabExtract/keytabextract.py"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/keytabextract"
    mode: 0755
  when: not keytabextract.stat.exists
