- name: "Check for any ligolo-ng build output"
  find:
    paths: "/opt/ligolo-ng/dist"
    file_type: any
    recurse: yes
    patterns: "ligolo-ng-*"
  register: ligolo_ng_dist_files
  changed_when: false

- name: "Build Go Ligolo Agents & Proxies"
  command: "make {{ item }}"
  args:
    chdir: "/opt/ligolo-ng"
  environment:
    PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  loop:
    - linux
    - windows
  become: true
  become_method: sudo
  when: (ligolo_ng_git.changed or ligolo_ng_dist_files.matched == 0) and ansible_facts['distribution']|lower == 'parrot'


- name: "Build Go Ligolo Agents & Proxies"
  command: "make {{ item }}"
  args:
    chdir: "/opt/ligolo-ng"
  environment:
    PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  loop:
    - linux-arm64
  become: true
  become_method: sudo
  when: (ligolo_ng_git.changed or ligolo_ng_dist_files.matched == 0) and ansible_facts['distribution']|lower == 'ubuntu'

- name: "Change the owner of ligolo-ng built binaries"
  file:
    path: "/opt/ligolo-ng/dist"
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
    recurse: yes
  become: true
  become_method: sudo

- name: "Move certain binaries to /usr/local/bin"
  copy:
    src: "/opt/ligolo-ng/dist/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
    mode: 0755
  loop:
    - ligolo-ng-agent-linux_amd64
    - ligolo-ng-proxy-linux_amd64
  become: true
  become_method: sudo
  when: ansible_facts['distribution']|lower == 'parrot'

- name: "Move certain binaries to /usr/local/bin"
  copy:
    src: "/opt/ligolo-ng/dist/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
    mode: 0755
  loop:
    - ligolo-ng-agent-linux_arm64
    - ligolo-ng-proxy-linux_arm64
  become: true
  become_method: sudo
  when: ansible_facts['distribution']|lower == 'ubuntu'

  