    destination: "/opt/Inveigh_net10"

  - repo: "Kevin-Robertson/Inveigh"
    regex: "Inveigh-net4.6.2"
    destination: "/opt/Inveigh_net4"

  - repo: "SnaffCon/Snaffler"
