GitHubReleases:
  - repo: "peass-ng/PEASS-ng"
    regex: "linpeas"
    destination: "/opt/linpeass"

  - repo: "peass-ng/PEASS-ng"
    regex: "winPEAS"
    destination: "/opt/winpeass"

  - repo: "SpecterOps/SharpHound"
    regex: "windows_x86.zip"
    destination: "/opt/sharphound"

  - repo: "WithSecureLabs/chainsaw"
    regex: "chainsaw_all_"
    destination: "/opt/chainsaw"

  - repo: "shadow1ng/fscan"
    regex: "fscan"
    destination: "/opt/fscan"

  - repo: "AlessandroZ/LaZagne"
    regex: "LaZagne"
    destination: "/opt/lazagne"

  - repo: "BeichenDream/GodPotato"
    regex: "GodPotato"
    destination: "/opt/godpotato"

  - repo: "itm4n/PrintSpoofer"
    regex: "PrintSpoofer"
    destination: "/opt/printspoofer"

  - repo: "trustedsec/DitExplorer"
    regex: "DitExplorer"
    destination: "/opt/ditexplorer"

  - repo: "gentilkiwi/mimikatz"
    regex: "mimikatz_trunk.zip"
    destination: "/opt/mimikatz"

  - repo: "ffuf/ffuf"
    regex: "linux_amd64.tar.gz"
    destination: "/opt/ffuf"

  - repo: "nccgroup/SocksOverRDP"
